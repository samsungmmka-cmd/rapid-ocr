# Production: settings and the API key come from .env (git-ignored, not baked into the image).
#   1. cp .env.example .env   and set API_KEY (python -c "import secrets; print(secrets.token_urlsafe(32))")
#   2. docker compose up -d --build
services:
  api:
    build: .
    image: doc-extraction-api:latest
    ports:
      - "8000:8000"
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
